</style></head><body><header><span>The Family Hymnal</span><i>Thanksgiving · 2026</i></header><p id="status" role="status">Opening your event hymnal…</p><main id="book" hidden><div class="spread"><div class="cover"><div class="coverinner"><small>Family edition</small><h1>Give <br>Thanks</h1><svg class="wheat" aria-hidden="true" viewBox="0 0 64 94"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M24 91Q30 48 51 11M24 91Q24 60 12 36M26 78Q47 60 58 45"/></g><g fill="currentColor"><defs><path id="grain" d="M0 0Q-9-3-8-13Q0-10 0 0M1-3Q11-6 11-15Q2-11 1-3"/></defs><use href="#grain" x="34" y="57"/><use href="#grain" x="38" y="47"/><use href="#grain" x="43" y="37"/><use href="#grain" x="47" y="27"/><path d="M50 20Q48 10 56 4Q55 15 50 20M23 66Q12 61 11 51Q20 55 23 66M18 52Q9 48 7 39Q15 41 18 52M37 68Q45 55 51 56Q48 64 37 68"/></g></svg></div></div><div class="binding"><div id="choose"><small>Order of hymns</small><ol id="contents" aria-label="Choose a hymn"></ol></div><div class="songhead"><small id="tune"></small><h2 id="songtitle"></h2><div id="playerbox" class="musicmeta"><audio id="piano" controls preload="metadata" aria-label="Piano accompaniment"></audio><div class="minor" id="cue"></div></div></div></div></div><nav aria-label="Hymnal views"><button data-mode="score">Sheet music</button><button data-mode="lyrics">Lyrics</button><button data-mode="print">Printables</button></nav><section id="stage"><small id="sectionlabel"></small><h2 id="title"></h2><div id="content"></div></section><footer><strong>Music credits</strong><p id="credit"></p>Piano accompaniments use Alexander Holm’s Salamander Grand Piano samples (<a href="https://creativecommons.org/licenses/by/3.0/" rel="noreferrer">CC BY 3.0</a>), arranged and sequenced for this event.</footer></main><script>
const $=s=>document.querySelector(s), el=(tag,text,cls)=>{let e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};const options=['score','lyrics','print'];let data,ix=0,mode='score',zoom=false;const p=$('#piano'),c=$('#content'),param=new URLSearchParams(location.search);ix=Math.max(0,Math.min(3,Number(param.get('hymn')||location.hash.slice(1)) - 1||0));if(options.includes(param.get('view')))mode=param.get('view');
function cue(){let t=data.tracks[ix],n=t.cue.filter(x=>x<=p.currentTime).length;$('#cue').textContent=p.ended?'Hymn complete':n?'Stanza '+n+' of '+t.lyrics.length:'Piano introduction · begin singing at 0:'+String(Math.round(t.cue[0])).padStart(2,'0');document.querySelectorAll('.verse').forEach((e,k)=>e.classList.toggle('active',k===n-1))}
function paper(i){let a=el('a',['Sheet music with words','Lyrics only','Complete event hymnal','Event QR cards'][i],'pdf');a.href=data.pdfs[i];a.target='_blank';a.rel='noopener noreferrer';a.append(el('span',['6 pages · all four vocal and piano scores','4 pages · all ten stanzas','10 pages · each score followed by its lyrics','1 page · four invitations to this full app'][i]+' · Open PDF'));return a}
function words(){let t=data.tracks[ix];t.lyrics.forEach((v,k)=>{let s=el('section',null,'verse');s.append(el('small','Stanza '+(k+1)),el('p',v));c.append(s)})}
function draw(){let t=data.tracks[ix];$('#title').textContent=mode==='print'?'Printables':t.title;$('#credit').textContent=mode==='print'?'Songwriter, tune and score credits are printed with each hymn.':t.credit;$('#songtitle').textContent=t.title;$('#tune').textContent=t.tune+' · '+t.key+' major · '+t.lyrics.length+(t.lyrics.length===1?' stanza':' stanzas');$('#sectionlabel').textContent=mode==='print'?'The print collection':('Hymn '+String(ix+1).padStart(2,'0')+'  /  '+(mode==='score'?'Sheet music':'Lyrics'));document.querySelectorAll('#contents button').forEach((b,k)=>b.setAttribute('aria-current',String(k===ix)));c.replaceChildren();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));if(mode==='print'){c.append(el('p','Open a PDF, then use Print or Save in your browser. On iPhone, tap Share → Print.','note'));for(let i=0;i<4;i++)c.append(paper(i))}else if(mode==='lyrics'){words();c.append(paper(1))}else{c.append(el('p',t.note,'note'));let z=el('button');function scale(){c.classList.toggle('big',zoom);z.textContent=zoom?'Fit full page':'Enlarge music and words';z.setAttribute('aria-pressed',zoom)}z.onclick=()=>{zoom=!zoom;scale()};scale();c.append(z);t.images.forEach((src,j)=>{let f=el('figure'),im=el('img');im.alt=t.title+' · notes and sung words, page '+(j+1);im.src=src;f.append(el('figcaption','Page '+(j+1)+' of '+t.images.length),im);c.append(f)});c.append(paper(0),el('h2','Words for singing'));words()}cue();if(location.protocol!=='file:'){let u=new URL(location.href);u.searchParams.set('view',mode);u.searchParams.set('hymn',ix+1);if(/^#[1-4]$/.test(u.hash))u.hash='';history.replaceState(null,'',u)}}
function pick(){p.pause();p.src=data.tracks[ix].audio;zoom=false;draw()}function ready(d){data=d;data.tracks.forEach((t,k)=>{let li=el('li'),btn=el('button');btn.append(el('span',String(k+1).padStart(2,'0'),'number'),document.createTextNode(t.title));btn.onclick=()=>{ix=k;if(mode==='print')mode='score';pick()};li.append(btn);$('#contents').append(li)});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw();$('#stage').scrollIntoView({block:'start'})});p.ontimeupdate=cue;$('#book').hidden=false;$('#status').hidden=true;pick()}
function bytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function expand(d){let mime=n=>n.endsWith('.png')?'image/png':n.endsWith('.pdf')?'application/pdf':'audio/mp4';let map={};for(let [n,v] of Object.entries(d.files))map[n]=URL.createObjectURL(new Blob([bytes(v)],{type:mime(n)}));d.tracks.forEach(t=>{t.audio=map[t.audio];t.images=t.images.map(n=>map[n])});d.pdfs=d.pdfs.map(n=>map[n]);return d}
(async()=>{let k=location.hash.slice(1);try{if(!k)k=localStorage.getItem('giveThanksEvent26')}catch{}if(!k){$('#status').textContent='Open the private event link from your host, or scan an event QR card. The guest preview does not include all four scores.';return}try{let key=await crypto.subtle.importKey('raw',bytes(k.replaceAll('-','+').replaceAll('_','/')),{name:'AES-GCM'},false,['decrypt']);let res=await fetch('book.bin');if(!res.ok)throw Error();let b=new Uint8Array(await res.arrayBuffer());let plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));let json=await new Response(new Blob([plaintext]).stream().pipeThrough(new DecompressionStream('gzip'))).json();ready(expand(json));try{localStorage.setItem('giveThanksEvent26',k)}catch{}}catch{$('#status').textContent='The event hymnal could not open. Check your connection and reopen the complete invitation link.'}})()
</script></body></html>
