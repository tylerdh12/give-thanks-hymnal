<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Give Thanks · Event hymnal</title><style>
*{box-sizing:border-box}html{background:#f8f5eb;color:#172f27}body{margin:auto;max-width:860px;padding:18px clamp(12px,3vw,28px) 52px;font:18px/1.5 Georgia,serif}header{border-top:4px solid #244c38;padding-top:12px}small,label,button,select,a,.note,footer{font-family:system-ui,sans-serif}small{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:bold;color:#51664e}h1{margin:0;font-size:clamp(38px,7vw,58px);font-weight:500;line-height:1.16}h2{line-height:1.18;font-size:clamp(25px,4vw,37px);font-weight:500;margin:18px 0 4px}label,footer,.note{font-size:14px;color:#47594b}select{width:100%;padding:10px 8px;background:white;color:#172f27;border:1px solid #9baf9d;border-radius:5px;font-size:17px}nav{position:sticky;top:0;z-index:2;display:flex;gap:4px;background:#f8f5eb;padding:8px 0;border-bottom:1px solid #bcc8b6}button,a.pdf{font-size:15px;min-height:44px;background:white;border:1px solid #9aa997;border-radius:5px;color:#173928;padding:8px 12px;cursor:pointer}nav button{flex:1;padding:6px;font-weight:600}button[aria-pressed=true]{background:#214d39;color:white}audio{width:100%;height:40px}.note{margin:6px 0 12px}figure{margin:0 0 14px;background:white;border:1px solid #d0d7c9;padding:5px;overflow-x:auto}img{display:block;width:100%;height:auto}.big img{min-width:1000px}figcaption{font:12px system-ui;color:#435646;padding:4px}.verse p{white-space:pre-line;font-size:clamp(21px,3vw,26px);line-height:1.5;margin:2px 0 16px}.verse{border-left:2px solid #b5a475;padding-left:12px;margin:16px 0}.verse.active{border-color:#305f43;background:#edf2e7}.pdf{display:block;text-decoration:none;margin:10px 0}.pdf span{display:block;font-size:13px;color:#536757}footer{margin-top:20px;padding-top:12px;border-top:1px solid #bbc7b7}a{color:#235638}button:focus-visible,a:focus-visible{outline:3px solid #a86813}#stage{scroll-margin-top:75px}#book[hidden]{display:none}.musicmeta{margin:8px 0}.minor{font:14px system-ui}.paper{margin-top:16px}summary{cursor:pointer} @media print{header,nav,#choose,.musicmeta,footer,button,.paper,.note,figcaption{display:none}body{background:white;padding:0}figure{break-inside:avoid}.big img{min-width:0}.verse{break-inside:avoid}}
</style></head><body><header><small>Thanksgiving 2026 · Event edition</small><h1>Give Thanks</h1></header><p id="status" role="status">Opening your event hymnal…</p><main id="book" hidden><div id="choose"><label for="hymn">Choose a hymn</label><select id="hymn"></select></div><nav aria-label="Hymnal views"><button data-mode="score">Sheet music</button><button data-mode="lyrics">Lyrics</button><button data-mode="print">Printables</button></nav><section id="stage"><h2 id="title"></h2><div id="playerbox" class="musicmeta"><audio id="piano" controls preload="metadata" aria-label="Piano accompaniment"></audio><div class="minor" id="cue"></div></div><div id="content"></div></section><footer><strong>Music credits</strong><p id="credit"></p>Piano accompaniments use Alexander Holm’s Salamander Grand Piano samples (<a href="https://creativecommons.org/licenses/by/3.0/" rel="noreferrer">CC BY 3.0</a>), arranged and sequenced for this event.</footer></main><script>
const $=s=>document.querySelector(s), el=(tag,text,cls)=>{let e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};const options=['score','lyrics','print'];let data,ix=0,mode='score',zoom=false;const p=$('#piano'),c=$('#content'),param=new URLSearchParams(location.search);ix=Math.max(0,Math.min(3,Number(param.get('hymn')||location.hash.slice(1)) - 1||0));if(options.includes(param.get('view')))mode=param.get('view');
function cue(){let t=data.tracks[ix],n=t.cue.filter(x=>x<=p.currentTime).length;$('#cue').textContent=p.ended?'Hymn complete':n?'Stanza '+n+' of '+t.lyrics.length:'Piano introduction · begin singing at 0:'+String(Math.round(t.cue[0])).padStart(2,'0');document.querySelectorAll('.verse').forEach((e,k)=>e.classList.toggle('active',k===n-1))}
function paper(i){let a=el('a',['Sheet music with words','Lyrics only','Complete event hymnal','Event QR cards'][i],'pdf');a.href=data.pdfs[i];a.target='_blank';a.rel='noopener noreferrer';a.append(el('span',['6 pages · all four vocal and piano scores','4 pages · all ten stanzas','10 pages · each score followed by its lyrics','1 page · four invitations to this full app'][i]+' · Open PDF'));return a}
function words(){let t=data.tracks[ix];t.lyrics.forEach((v,k)=>{let s=el('section',null,'verse');s.append(el('small','Stanza '+(k+1)),el('p',v));c.append(s)})}
function draw(){let t=data.tracks[ix];$('#title').textContent=mode==='print'?'Printables':t.title;$('#credit').textContent=mode==='print'?'Songwriter, tune and score credits are printed with each hymn.':t.credit;$('#playerbox').hidden=mode==='print';c.replaceChildren();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));if(mode==='print'){c.append(el('p','Open a PDF, then use Print or Save in your browser. On iPhone, tap Share → Print.','note'));for(let i=0;i<4;i++)c.append(paper(i))}else if(mode==='lyrics'){words();c.append(paper(1))}else{c.append(el('p',t.note,'note'));let z=el('button');function scale(){c.classList.toggle('big',zoom);z.textContent=zoom?'Fit full page':'Enlarge music and words';z.setAttribute('aria-pressed',zoom)}z.onclick=()=>{zoom=!zoom;scale()};scale();c.append(z);t.images.forEach((src,j)=>{let f=el('figure'),im=el('img');im.alt=t.title+' · notes and sung words, page '+(j+1);im.src=src;f.append(el('figcaption','Page '+(j+1)+' of '+t.images.length),im);c.append(f)});c.append(paper(0),el('h2','Words for singing'));words()}cue();if(location.protocol!=='file:'){let u=new URL(location.href);u.searchParams.set('view',mode);u.searchParams.set('hymn',ix+1);if(/^#[1-4]$/.test(u.hash))u.hash='';history.replaceState(null,'',u)}}
function pick(){p.pause();p.src=data.tracks[ix].audio;zoom=false;draw()}function ready(d){data=d;data.tracks.forEach((t,k)=>{let o=el('option',(k+1)+'. '+t.title);o.value=k;$('#hymn').append(o)});$('#hymn').value=ix;$('#hymn').onchange=e=>{ix=Number(e.target.value);pick()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});p.ontimeupdate=cue;$('#book').hidden=false;$('#status').hidden=true;pick()}
function bytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function expand(d){let mime=n=>n.endsWith('.png')?'image/png':n.endsWith('.pdf')?'application/pdf':'audio/mp4';let map={};for(let [n,v] of Object.entries(d.files))map[n]=URL.createObjectURL(new Blob([bytes(v)],{type:mime(n)}));d.tracks.forEach(t=>{t.audio=map[t.audio];t.images=t.images.map(n=>map[n])});d.pdfs=d.pdfs.map(n=>map[n]);return d}
(async()=>{let k=location.hash.slice(1);try{if(!k)k=localStorage.getItem('giveThanksEvent26')}catch{}if(!k){$('#status').textContent='Open the private event link from your host, or scan an event QR card. The guest preview does not include all four scores.';return}try{let key=await crypto.subtle.importKey('raw',bytes(k.replaceAll('-','+').replaceAll('_','/')),{name:'AES-GCM'},false,['decrypt']);let res=await fetch('book.bin');if(!res.ok)throw Error();let b=new Uint8Array(await res.arrayBuffer());let plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));let json=await new Response(new Blob([plaintext]).stream().pipeThrough(new DecompressionStream('gzip'))).json();ready(expand(json));try{localStorage.setItem('giveThanksEvent26',k)}catch{}}catch{$('#status').textContent='The event hymnal could not open. Check your connection and reopen the complete invitation link.'}})()
</script></body></html>
