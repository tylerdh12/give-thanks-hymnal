</style></head><body><header><span>The Family Hymnal</span><i>Thanksgiving · 2026</i></header><p id="status" role="status">Opening your event hymnal…</p><main id="book" hidden><div class="spread"><div class="cover"><div class="coverinner"><small>Family edition</small><h1>Give <br>Thanks</h1><svg class="wheat" aria-hidden="true" viewBox="0 0 64 94"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M24 91Q30 48 51 11M24 91Q24 60 12 36M26 78Q47 60 58 45"/></g><g fill="currentColor"><defs><path id="grain" d="M0 0Q-9-3-8-13Q0-10 0 0M1-3Q11-6 11-15Q2-11 1-3"/></defs><use href="#grain" x="34" y="57"/><use href="#grain" x="38" y="47"/><use href="#grain" x="43" y="37"/><use href="#grain" x="47" y="27"/><path d="M50 20Q48 10 56 4Q55 15 50 20M23 66Q12 61 11 51Q20 55 23 66M18 52Q9 48 7 39Q15 41 18 52M37 68Q45 55 51 56Q48 64 37 68"/></g></svg></div></div><div class="binding"><div id="choose"><small>Order of hymns</small><ol id="contents" aria-label="Choose a hymn"></ol></div><div class="songhead"><small id="tune"></small><h2 id="songtitle"></h2><div id="playerbox" class="musicmeta"><audio id="piano" controls preload="metadata" aria-label="Piano accompaniment"></audio><div class="minor" id="cue"></div></div></div></div></div><div id="nav-anchor"></div><nav aria-label="Hymnal views" id="views"><div id="mini" hidden><button id="index-link" aria-label="Return to the hymn list">↑ Hymns</button><span id="mini-name"></span><button id="transport">▶ Play piano</button></div><div class="tabrow"><button data-mode="score">Sheet music</button><button data-mode="lyrics">Lyrics</button><button data-mode="print">Printables</button></div></nav><section id="stage" tabindex="-1"><small id="sectionlabel"></small><h2 id="title"></h2><div id="content"></div><div id="turns" aria-label="Other hymns"></div></section><footer><details><summary>Music &amp; attributions</summary><p id="credit"></p>Piano accompaniments use Alexander Holm’s Salamander Grand Piano samples (<a href="https://creativecommons.org/licenses/by/3.0/" rel="noreferrer">CC BY 3.0</a>), arranged and sequenced for this event.</details></footer></main><script>
const $=s=>document.querySelector(s), el=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};
const p=$('#piano'),c=$('#content'),nav=$('#views'),options=['score','lyrics','print'];
let data,ix=-1,mode='score',zoom=false,large=false;
function route(){const u=new URL(location.href),n=u.searchParams.get('hymn')||u.hash.slice(1);return {song:/^[1-4]$/.test(n)?Number(n)-1:0,view:options.includes(u.searchParams.get('view'))?u.searchParams.get('view'):'score'}}
function locationFor(replace){if(location.protocol==='file:')return;const u=new URL(location.href);u.searchParams.set('view',mode);u.searchParams.set('hymn',ix+1);if(/^#[1-4]$/.test(u.hash))u.hash='';if(u.href!==location.href)history[replace?'replaceState':'pushState'](null,'',u)}
function clock(t){return Math.floor(t/60)+':'+String(Math.floor(t)%60).padStart(2,'0')}
function cue(){if(ix<0)return;const t=data.tracks[ix],n=t.cue.filter(x=>x<=p.currentTime).length;
 const text=p.error?'Piano unavailable. The music and words are still here.':p.ended?'Hymn complete':n?'Stanza '+n+' of '+t.lyrics.length:'Piano introduction · begin singing at '+clock(Math.round(t.cue[0]));if($('#cue').textContent!==text)$('#cue').textContent=text;
 $('#transport').textContent=p.paused?'▶  Play piano':'Ⅱ  Pause piano';document.querySelectorAll('.verse').forEach((v,k)=>v.classList.toggle('active',k===n-1))}
function action(label,fn,cls){const b=el('button',label,cls);b.type='button';b.onclick=fn;return b}
function paper(i){const a=el('a',null,'pdf');a.href=data.pdfs[i];a.target='_blank';a.rel='noopener noreferrer';
 a.append(el('small',['Singers & accompanists','For the congregation','The complete collection','For your guests'][i]),el('strong',['Sheet music with words','Lyrics only','Complete event hymnal','Event QR cards'][i]),el('span',['6 pages · Vocal and piano scores','4 pages · All ten stanzas','10 pages · Each score with its lyric sheet','1 page · Four private event invitations'][i]),el('em','Open PDF ↗'));return a}
function score(t){const row=el('div',null,'utility'),desc=el('p',t.note,'note');const b=action('',()=>{zoom=!zoom;size()});function size(){c.classList.toggle('big',zoom);b.textContent=zoom?'Fit full page':'Enlarge music and words';b.setAttribute('aria-pressed',String(zoom));b.title=zoom?'Fit the notation to the page':'Enlarge the notation; scroll sideways inside each page'}size();row.append(desc,b);c.append(row);
 t.images.forEach((src,j)=>{const f=el('figure'),im=el('img');im.alt=t.title+' · vocal and piano score with stanza words, page '+(j+1);const dims=[[[1497, 1666], [1497, 1666]], [[1516, 1610]], [[1562, 1672], [1508, 1148]], [[1510, 1281]]][ix][j];im.width=dims[0];im.height=dims[1];im.src=src;f.append(el('figcaption','Score  /  '+String(j+1).padStart(2,'0')+' of '+String(t.images.length).padStart(2,'0')),im);c.append(f)})}
function lyrics(t){const row=el('div',null,'utility'),b=action('',()=>{large=!large;size();try{localStorage.setItem('gt-large',String(large))}catch{}});function size(){c.classList.toggle('large-type',large);b.textContent=large?'Standard type':'Larger type';b.setAttribute('aria-pressed',String(large))}size();row.append(el('small','Words for singing'),b);c.append(row);
 t.lyrics.forEach((v,k)=>{const s=el('section',null,'verse');s.append(el('small','Stanza '+(k+1)),el('p',v));c.append(s)})}
function printables(){c.append(el('p','Choose a PDF to open, save, or print. On iPhone, use Share → Print.','note'));const grid=el('div',null,'print-grid');for(const i of [2,0,1,3])grid.append(paper(i));c.append(grid)}
function jump(){const stage=$('#stage');stage.focus({preventScroll:true});$('#mini').hidden=false;window.scrollTo(0,window.scrollY+$('#nav-anchor').getBoundingClientRect().top)}
function contents(){window.scrollTo(0,0);$('#contents button[aria-current="true"]').focus({preventScroll:true})}
function turn(k,v,bring=true,record=true){const change=k!==ix;if(change){p.pause();ix=k;p.src=data.tracks[ix].audio;zoom=false}mode=v;render();if(record)locationFor(false);if(bring)jump()}
function render(){const t=data.tracks[ix],nm=t.title,print=mode==='print';$('#songtitle').textContent=nm;$('#tune').textContent=t.tune+' · '+t.key+' major · '+t.lyrics.length+(t.lyrics.length===1?' stanza':' stanzas');
 $('#sectionlabel').textContent=print?'Thanksgiving 2026  /  Library':'Hymn '+String(ix+1).padStart(2,'0')+'  /  '+t.tune;
 $('#title').textContent=print?'The print collection':mode==='lyrics'?'Lyrics':'Vocal & piano score';$('#mini-name').textContent=print?'The print collection':nm;
 $('#credit').textContent=print?'Songwriter, tune and score credits are printed with each hymn.':t.credit;document.querySelectorAll('#contents button').forEach((b,k)=>b.setAttribute('aria-current',String(k===ix)));
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));c.className='';c.replaceChildren();
 if(print)printables();else if(mode==='lyrics')lyrics(t);else score(t);
 const turns=$('#turns');turns.replaceChildren();turns.hidden=print;if(!print){for(const delta of [-1,1]){const k=ix+delta;if(k<0||k>=data.tracks.length)continue;const b=action('',()=>turn(k,mode),'turn');b.append(el('small',delta<0?'← Previous hymn':'Next hymn →'),el('span',data.tracks[k].title));turns.append(b)}}cue()}
function ready(d){data=d;try{large=localStorage.getItem('gt-large')==='true'}catch{};data.tracks.forEach((t,k)=>{const li=el('li'),btn=action('',()=>turn(k,mode==='print'?'score':mode));btn.append(el('span',String(k+1).padStart(2,'0'),'number'),document.createTextNode(t.title));li.append(btn);$('#contents').append(li)});
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>turn(ix,b.dataset.mode));$('#index-link').onclick=contents;
 $('#transport').onclick=async()=>{if(!p.paused)p.pause();else try{await p.play()}catch{$('#cue').textContent='Use the piano player to start playback.'}};
 for(const name of ['play','pause','timeupdate','ended','error','loadedmetadata'])p.addEventListener(name,cue);
 $('#book').hidden=false;$('#status').hidden=true;const r=route();turn(r.song,r.view,false,false);locationFor(true);
 addEventListener('popstate',()=>{const r=route();turn(r.song,r.view,true,false)});
 const setDock=()=>{const dock=$('#mini');const compact=$('#nav-anchor').getBoundingClientRect().top<=1&&window.scrollY>100;dock.hidden=!compact};addEventListener('scroll',setDock,{passive:true});addEventListener('resize',setDock);setDock()}
function bytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function expand(d){let mime=n=>n.endsWith('.png')?'image/png':n.endsWith('.pdf')?'application/pdf':'audio/mp4';let map={};for(let [n,v] of Object.entries(d.files))map[n]=URL.createObjectURL(new Blob([bytes(v)],{type:mime(n)}));d.tracks.forEach(t=>{t.audio=map[t.audio];t.images=t.images.map(n=>map[n])});d.pdfs=d.pdfs.map(n=>map[n]);return d}
(async()=>{let k=location.hash.slice(1);try{if(!k)k=localStorage.getItem('giveThanksEvent26')}catch{}if(!k){$('#status').textContent='Open the private event link from your host, or scan an event QR card. The guest preview does not include all four scores.';return}try{let key=await crypto.subtle.importKey('raw',bytes(k.replaceAll('-','+').replaceAll('_','/')),{name:'AES-GCM'},false,['decrypt']);let res=await fetch('book.bin');if(!res.ok)throw Error();let b=new Uint8Array(await res.arrayBuffer());let plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));let json=await new Response(new Blob([plaintext]).stream().pipeThrough(new DecompressionStream('gzip'))).json();ready(expand(json));try{localStorage.setItem('giveThanksEvent26',k)}catch{}}catch{$('#status').textContent='The event hymnal could not open. Check your connection and reopen the complete invitation link.'}})()
</script></body></html>
